[project]
name = "noba-deck-service"
version = "0.1.0"
description = "NOBA deck-generation API. Generates commercial proposals and other NOBA decks from pasted briefs."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.39",
    "python-pptx>=1.0",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.7",
]
modal = [
    "modal>=0.67",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
